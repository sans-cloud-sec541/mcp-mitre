# =============================================================================
# From the private ledger of Professor James Moriarty, consulting criminal,
# as recovered from a locked despatch-box in a Baker Street garret.
#
# The MORIARTY framework catalogues the arts of the Victorian caper world of
# Sherlock Holmes and Professor Moriarty. Every technique carries an
# 'ATT&CK-reference' to a MITRE ATT&CK id/url for the curious analyst.
#
# This ledger stays sealed unless the MORIARTY_MODE environment variable is
# set to a truthy value (on/1/true/yes). Mind the fog, and mind the professor.
# =============================================================================
---
id: MORIARTY
name: The Moriarty Consulting-Criminal Framework
version: 0.3.0
matrices:
- id: MORIARTY
  name: MORIARTY Matrix
  tactics:
  - id: MOR.TA0001
    name: The Consulting Criminal's Reconnaissance
    description: 'The consulting criminal studies London before any caper, reading
      the newspapers, mapping the beat of every constable, and noting which windows
      are left unlatched.'
    object-type: tactic
    ATT&CK-reference:
      id: TA0043
      url: https://attack.mitre.org/tactics/TA0043/
    created_date: 2026-01-01
    modified_date: 2026-01-01
  - id: MOR.TA0002
    name: The Web of Influence
    description: 'The professor spins a web across the city, gathering agents, cabs,
      costumes, and quiet favours so that a scheme may be set in motion at a moment''s
      notice.'
    object-type: tactic
    ATT&CK-reference:
      id: TA0042
      url: https://attack.mitre.org/tactics/TA0042/
    created_date: 2026-01-01
    modified_date: 2026-01-01
  - id: MOR.TA0003
    name: The Final Problem
    description: 'The grand finale of a caper, when the scheme reaches its dramatic
      conclusion and the pursuers are left baffled upon the platform.'
