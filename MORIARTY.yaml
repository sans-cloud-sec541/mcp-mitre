    ATT&CK-reference:
      id: TA0040
      url: https://attack.mitre.org/tactics/TA0040/
    created_date: 2026-01-01
    modified_date: 2026-01-01
  techniques:
  - id: MOR.T0001
    name: The Baker Street Chalk-Mark
    description: 'Chalk signals scrawled on lampposts and doorsteps to coordinate the
