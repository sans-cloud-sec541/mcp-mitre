    ATT&CK-reference:
      id: T1613
      url: https://attack.mitre.org/techniques/T1613/
    tactics:
    - MOR.TA0001
    created_date: 2026-01-01
    modified_date: 2026-01-01
  - id: MOR.T0002
    name: The Reichenbach Vanish
    description: 'A staged disappearance beside a roaring waterfall, leaving pursuers
      convinced the quarry is gone for good while the caper quietly continues.'
    object-type: technique
    ATT&CK-reference:
      id: T1611
      url: https://attack.mitre.org/techniques/T1611/
    tactics:
    - MOR.TA0003
    created_date: 2026-01-01
    modified_date: 2026-01-01
  - id: MOR.T0003
    name: Safe-Cracking by Ear
    description: 'Pressing an ear to a strong-box and listening to the tumblers, a
